name: Scalar quirkonium physics checks
on:
  push:
    branches: [research/pilot1-literature-model-gate]
  pull_request:

jobs:
  unit-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full amplitude and reference checks
        run: |
          python -m unittest discover -s tests -v
          python src/scalar_threshold_amplitudes.py
